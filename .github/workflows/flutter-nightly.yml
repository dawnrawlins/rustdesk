name: Flutter Nightly Build

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: GitHub release tag to publish the installers to
        required: false
        default: nightly
      windows-only:
        description: Build only the Windows Flutter installers (branded builds)
        type: boolean
        required: false
        default: false

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag || 'nightly' }}
      windows-only: ${{ inputs.windows-only || false }}
